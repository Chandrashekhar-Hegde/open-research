name: Bug or evidence correction
description: Report a broken workflow, incorrect claim, or reproducibility failure.
title: "[Correction] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Link the affected file, claim, or command and describe what is wrong.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction
      description: Give source locations or a minimal command, environment, and observed/expected result. Exclude secrets and private data.
    validations:
      required: true
